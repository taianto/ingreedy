services:
  postgres:
    image: postgres:16-alpine
    container_name: ingreedy-postgres
    environment:
      POSTGRES_DB: ingreedy
      POSTGRES_USER: ingreedy
      POSTGRES_PASSWORD: ingreedy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ingreedy -d ingreedy"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: ingreedy-backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ingreedy
      SPRING_DATASOURCE_USERNAME: ingreedy
      SPRING_DATASOURCE_PASSWORD: ingreedy
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    container_name: ingreedy-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
