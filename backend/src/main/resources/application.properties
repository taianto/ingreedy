spring.application.name=core
spring.devtools.restart.enabled=true

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ingreedy}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ingreedy}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ingreedy}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

llm.openai.base-url=https://api.openai.com
llm.openai.api-key=${OPENAI_API_KEY:}
llm.openai.model=gpt-4.1-mini
llm.openai.temperature=0.7
llm.openai.mock-enabled=false
